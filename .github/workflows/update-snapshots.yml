name: Update Snapshots
on:
  push:
    branches:
      - feat/use-includes-last-index-of

permissions:
  contents: write

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests with snapshot update
        env:
          UPDATE_EXPECT: "1"
        run: cargo test -p biome_js_analyze -- spec_tests::nursery_use_includes
      - name: Commit updated snapshots
        run: |
          git config user.name "Adit Jain"
          git config user.email "aditjain2005@gmail.com"
          git add -A
          git diff --cached --quiet || git commit -m "test: update useIncludes snapshots after lastIndexOf expansion"
          git push
